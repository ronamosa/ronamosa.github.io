<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Getting you on the list…</title>

<!-- ── EDIT THESE TWO THINGS ────────────────────────────────
     1. DEST   → the beehiiv hosted subscribe page (one place, below)
     2. GA4 ID → the site Measurement ID, appears TWICE (src + config)
     ─────────────────────────────────────────────────────── -->

<script>
  // 1. The mailing-list destination — the ONLY place it lives.
  //    The v2 iframe embed strips UTM/referrer, so this points at the
  //    beehiiv HOSTED page (Brand-System §6 UTM registry).
  var DEST = "https://bee.uncommonengineer.com/subscribe";

  // Attribution recovered server-side, which is the whole point of /list.
  // Bluesky counts the full URL in its 300-character limit, so the posted
  // link carries no query string (Block 9 variant B, ratified 2026-09-17).
  // These defaults are re-attached here, before the bounce.
  var DEFAULTS = { utm_source: "bluesky", utm_medium: "post", utm_content: "block9-cta" };
</script>

<!-- 2. GA4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-DMRNTVGLRC"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());

  // Any utm_* supplied on the way in wins, so /list is reusable from another
  // surface without editing this file. Absent ones fall back to the defaults.
  var incoming = new URLSearchParams(window.location.search);
  var target = new URL(DEST);
  Object.keys(DEFAULTS).forEach(function (key) {
    target.searchParams.set(key, incoming.get(key) || DEFAULTS[key]);
  });
  incoming.forEach(function (value, key) {
    if (key.indexOf('utm_') === 0) { target.searchParams.set(key, value); }
  });

  // page_view fires automatically and GA4 reads utm_* off this page's URL.
  // sendBeacon keeps it alive through the redirect.
  gtag('config', 'G-DMRNTVGLRC', { page_title: 'list-redirect' });

  // Bounce after GA has had its moment. ~500ms is invisible to the user
  // and comfortably enough for the beacon to leave.
  setTimeout(function(){ window.location.replace(target.toString()); }, 500);
</script>
</head>
<body style="font-family:system-ui,-apple-system,sans-serif;background:#0b0b0b;color:#eaeaea;display:grid;place-items:center;height:100vh;margin:0">
  <p style="opacity:.8">taking you to the list…
    <a id="fallback" href="#" style="color:#ff2fb9;text-decoration:none">click here if nothing happens</a>
  </p>
  <script>document.getElementById('fallback').href = target.toString();</script>
</body>
</html>
